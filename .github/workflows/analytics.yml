name: Analytics Poll and Report

on:
  schedule:
    - cron: '0 4 * * *'   # 9am PKT
    - cron: '0 14 * * *'  # 7pm PKT
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: posting-agent-db
  cancel-in-progress: false

jobs:
  analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore performance DB
        uses: actions/cache@v4
        with:
          path: performance.db
          key: performance-db-${{ github.run_id }}
          restore-keys: |
            performance-db-

      - name: Poll LinkedIn metrics
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_ORG_URN: ${{ secrets.LINKEDIN_ORG_URN }}
          LOG_FORMAT: json
        run: python analytics_tracker.py --poll

      - name: Send analytics report to Discord
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_ANALYTICS_CHANNEL_ID: ${{ secrets.DISCORD_ANALYTICS_CHANNEL_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          LOG_FORMAT: json
        run: python discord_bot.py --send-report
        continue-on-error: true

      - name: Commit durable metrics history
        if: always()
        run: |
          if [ -n "$(git status --porcelain data/metrics_history.jsonl 2>/dev/null)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/metrics_history.jsonl
            git commit -m "chore: record metrics snapshot [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin "${{ github.ref_name }}" && git push && break
              echo "Push attempt $i failed — retrying..."
              sleep 5
            done
          else
            echo "No new metrics snapshots — skipping commit."
          fi
